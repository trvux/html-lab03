<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Đăng ký mua hoa</title>
    </head>
    <body>
        <h2>ĐĂNG KÝ MUA HOA</h2>
        <font color="red">
            Quý độc giả hãy điền đầy đủ các thông tin theo yêu cầu để nhận được sản
            phẩm hoa, cây cảnh ưa thích nhất
        </font>
        <br /><br />

        <form>
            <label for="hoten">Họ và tên:</label>
            <input type="text" id="hoten" name="hoten" required /> (*)<br /><br />

            <label for="diachi">Địa chỉ:</label>
            <input type="text" id="diachi" name="diachi" required /> (*)<br /><br />

            <label for="dienthoai">Điện thoại:</label>
            <input type="tel" id="dienthoai" name="dienthoai" required /> (*)<br /><br />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required /> (*)<br /><br />

            <label for="loaihoa">Loại hoa:</label>
            <select id="loaihoa" name="loaihoa">
                <option value="Hoa Hong">Hoa Hồng</option>
                <option value="Hoa Cuc">Hoa Cúc</option>
                <option value="Hoa Lan">Hoa Lan</option>
                <option value="Hoa Huong Duong">Hoa Hướng Dương</option>
            </select>
            <label for="mau">Màu</label>
            <select id="mau" name="mau">
                <option value="Do">Đỏ</option>
                <option value="Vang">Vàng</option>
                <option value="Trang">Trắng</option>
                <option value="Hong">Hồng</option>
            </select><br /><br />

            <label for="soluong">Số lượng:</label>
            <input type="number" id="soluong" name="soluong" required /> (*)<br /><br />

            <label>Đơn vị tính:</label>
            <input type="radio" id="nhanh" name="donvitinh" value="Nhanh" />
            <label for="nhanh">Nhánh</label>
            <input type="radio" id="bo" name="donvitinh" value="Bo" />
            <label for="bo">Bó</label>
            <input type="radio" id="chau" name="donvitinh" value="Chau" />
            <label for="chau">Chậu</label><br /><br />

            <label>Thanh toán:</label>
            <input type="radio" id="tienmat" name="thanhtoan" value="Tien mat" />
            <label for="tienmat">Tiền mặt</label>
            <input type="radio" id="chuyenkhoan" name="thanhtoan" value="Chuyen khoan" />
            <label for="chuyenkhoan">Chuyển khoản</label>
            <input type="radio" id="mastercard" name="thanhtoan" value="Master card" />
            <label for="mastercard">Master card</label><br /><br />

            <label for="yeucau">Yêu cầu:</label><br />
            <textarea id="yeucau" name="yeucau" rows="6" cols="50"></textarea><br /><br />

            <input type="submit" value="Đăng ký" />
            <input type="reset" value="Nhập lại" />
        </form>
    </body>
</html>
